[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yaw"
version = "0.1.0"
description = "HippoRAG 2 evaluation workspace"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "cocoindex>=1.0.25",
    "dspy[deno]>=3.4.1",
    "filelock>=3.32.7",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "psutil>=7.2.2",
    "scipy>=1.18.1",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
yaw = "yaw.daemon.cli:cli_entrypoint"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["yaw*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
