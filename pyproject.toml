[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yaw"
version = "0.1.0"
description = "Local-first SQLite retrieval and DSPy QA library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rag", "retrieval", "sqlite", "fts5", "dspy", "cocoindex", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.14"
dependencies = [
    "cocoindex>=1.2.0",
    "dspy[openai]>=3.5.0",
    "fastmcp>=4.2.0",
    "filelock>=3.32.7",
    "numpy>=2.5.4",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
]

[project.scripts]
yaw = "yaw.cli:cli_entrypoint"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-testmon>=2.2.0",
    "ruff>=0.17.1",
    "coverage>=7.17.0",
    "pytest-cov>=7.0.0",
    "ty>=0.0.89",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
]

[tool.uv]
package = true
preview-features = ["content-addressed-cache"]

[tool.setuptools]
packages = ["yaw", "yaw.core", "yaw.pipeline", "yaw.retrieval", "yaw.wiki"]

[tool.setuptools.package-data]
yaw = ["py.typed", "baselines.json"]

[tool.ruff]
fix = true
line-length = 120
target-version = "py314"

[tool.ruff.lint]
exclude = ["docs/reviews/inference-backend-probes/**"]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "PGH",
    "DTZ",
    "S110",
    "S112",
    "BLE",
    "PLE",
    "PLW",
    "PERF",
    "PTH",
    "ERA",
    "ARG",
    "A",
    "RUF100",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "C901",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ANN202", "ANN204", "A002"]

[tool.ruff.format]
exclude = ["docs/**"]

[tool.ty.src]
exclude = ["docs/reviews/inference-backend-probes/**"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
addopts = ["--testmon"]
faulthandler_timeout = 120
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: explicitly enabled tests against a resident inference service"]
