[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yaw"
version = "0.1.0"
description = "HippoRAG 2 evaluation workspace"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "cocoindex>=1.0.25",
    "dspy[deno]>=3.0.0",
    "filelock>=3.18.0",
    "numpy>=2.5.4",
    "optuna>=4.0.0",
    "scipy>=1.15.0",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
yaw = "yaw.daemon.cli:cli_entrypoint"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.11.0",
    "ty>=0.0.1a0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["yaw*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B010", "B009"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:litellm.*",
    "ignore:.*Pydantic serializer warnings.*:UserWarning:pydantic.main",
]
