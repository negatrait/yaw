# YAW Native HippoRAG 2 Daemon Configuration

[paths]
corpus_root = "corpus"
db_path = ".yaw/yaw.db"
lock_path = ".yaw/yaw.db.lock"
state_dir = ".yaw/coco_state"
log_path = ".yaw/yaw.log"
status_path = ".yaw/status.json"
compiled_program_path = ".yaw/compiled_program.json"

[ingestion]
# included_patterns = ["*.md", "*.txt", "*.json"]
# excluded_patterns = [".*", "*/.*", "__pycache__/*"]
chunk_size = 1000
chunk_overlap = 150
min_chunk_size = 100
poll_interval_seconds = 10.0

[inference]
base_url = "http://127.0.0.1:8888/v1"
provider = "openai"
embedding_model = "embeddinggemma-2"
embedding_task_mode = "distinct-titled"
extraction_model = "gemma-4-e4b"
qa_model = "gemma-4-e4b"
# Runtime reads active model capacity from the configured endpoint.
# Omitted max_output_tokens leaves generation capacity to the endpoint.
# RLM tool output follows context capacity (20000 characters at 128K).
# Reflection input is bounded independently in characters.
# Set max_output_tokens, reflection_input_chars or rlm_max_output_chars to pin a limit.
# Independent execution budgets; a larger context does not require more tool calls.
rlm_max_iters = 20
rlm_max_llm_calls = 50

[graph]
linking_top_k = 10
retrieval_top_k = 10
damping = 0.5

candidate_dense_threshold = 0.85
candidate_lexical_threshold = 0.675
auto_merge_threshold = 0.98
candidate_volume_ratio = 0.5
semantic_adjudication_batch_size = 5
embed_batch_size = 32
# Aggregate formatted-input budget per embedding request; tune for the provider.
embed_batch_chars = 4096

[runtime]
queue_maxsize = 32
http_host = "127.0.0.1"
http_port = 13306
http_path = "/mcp"

[optimization]
datasets = ["enterprise_rag_bench"]
mode = "gepa"
max_queries = 162
train_queries = 135
query_offset = 0
auto = "light"
sleep_seconds = 0.0
max_bootstrapped_demos = 1
max_labeled_demos = 1
