# YAW Native HippoRAG 2 Daemon Configuration

[paths]
corpus_root = "corpus"
db_path = ".yaw/yaw.db"
lock_path = ".yaw/yaw.db.lock"
state_dir = ".yaw/coco_state"
log_path = ".yaw/yaw.log"
status_path = ".yaw/status.json"
compiled_program_path = ".yaw/compiled_program.json"

[ingestion]
included_patterns = ["*.md", "*.txt"]
excluded_patterns = [".*", "*/.*", "__pycache__/*"]
chunk_size = 1500
chunk_overlap = 120
min_chunk_size = 100
poll_interval_seconds = 10.0

[inference]
base_url = "http://localhost:13305/api/v1"
api_key = "lemonade"
provider = "openai"
embedding_model = "embeddinggemma-300m-qat-q8_0-GGUF-Q8_0"
embedding_task_mode = "distinct-titled"
extraction_model = "gemma-4-E4B-it-qat-q4_0-gguf-Q4_0"
qa_model = "gemma-4-E4B-it-qat-q4_0-gguf-Q4_0"
# Match the external server's configured serving window, not its advertised maximum.
context_window_tokens = 131072
# Omitted budgets follow context capacity: at 128K, output=8192 tokens,
# reflection input=32768 tokens, and RLM output=20000 characters.
# Set max_output_tokens, reflection_input_tokens or rlm_max_output_chars to pin a limit.
# Independent execution budgets; a larger context does not require more tool calls.
rlm_max_iters = 10
rlm_max_llm_calls = 20
# Set only when Lemonade does not advertise the resident llama.cpp backend URL.
reflection_tokenizer_url = ""
enable_gbnf = true
gbnf_max_facts = 4

[graph]
linking_top_k = 8
retrieval_top_k = 10
damping = 0.5

synonymy_threshold = 0.8
synonymy_top_k = 100
embed_batch_size = 64
# Aggregate formatted-input budget per embedding request; tune for the provider.
embed_batch_chars = 3500

[runtime]
queue_maxsize = 32
http_host = "127.0.0.1"
http_port = 13306
http_path = "/mcp"

[optimization]
datasets = ["enterprise_rag_bench"]
mode = "gepa"
max_queries = 250
train_queries = 150
query_offset = 0
auto = "light"
sleep_seconds = 0.0
max_bootstrapped_demos = 0
max_labeled_demos = 0
