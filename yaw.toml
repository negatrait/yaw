# YAW Vector Search & QA Daemon Configuration

[paths]
# Directory watched and indexed into SQLite.
corpus_root = "corpus"
# Optional visible user-editable Librarian wiki directory watched alongside corpus_root.
# wiki_root = "wiki"
# Primary SQLite database storing plain ROWID chunks (<f2> embeddings), FTS5/fts5vocab, rabitq_index, and citation_graph.
db_path = ".yaw/yaw.db"
# Exclusive file lock guarding daemon and write access to yaw.db.
lock_path = ".yaw/yaw.db.lock"
# Persistent CocoIndex LMDB memo state directory.
state_dir = ".yaw/coco_lmdb"
# Rotating 500-line FIFO runtime log file.
log_path = ".yaw/yaw.log"
# Atomic JSON snapshot of daemon lifecycle and chunk counts.
status_path = ".yaw/status.json"
# Optional compiled DSPy QA program JSON path loaded by qa/daemon.
compiled_program_path = ".yaw/compiled_program.json"

[ingestion]
# Glob patterns of source files included in live corpus indexing.
included_patterns = [
    "*.md", "*.mdx", "*.txt", "*.rst", "*.adoc", "*.org",
    "*.py", "*.pyi", "*.rs", "*.ts", "*.tsx", "*.js", "*.jsx", "*.mjs", "*.cjs",
    "*.go", "*.java", "*.kt", "*.kts", "*.c", "*.h", "*.cpp", "*.hpp", "*.cc", "*.cs",
    "*.rb", "*.php", "*.swift", "*.scala", "*.lua", "*.r", "*.R",
    "*.sh", "*.bash", "*.zsh", "*.sql", "*.graphql", "*.proto",
    "*.yaml", "*.yml", "*.toml", "*.json", "*.jsonl", "*.xml", "*.html", "*.css", "*.scss",
    "*.tex", "*.bib", "*.pas", "*.dpr", "*.f90", "*.sol", "*.dtd",
]
# Glob patterns excluded from directory traversal.
excluded_patterns = [".*", "*/.*", "__pycache__/*"]
# Maximum document chunk body size in UTF-8 bytes; not a token count.
chunk_size = 1000
# Byte overlap preserved between adjacent document chunks.
chunk_overlap = 150
# Minimum chunk size target passed to the native splitter.
min_chunk_size = 100
# Maximum separate chunk inputs per native CocoIndex/DSPy embedding batch.
embed_batch_size = 5

[inference]
# OpenAI-compatible inference base URL for embeddings and QA chat completions.
base_url = "http://127.0.0.1:8888/v1"
# Optional bearer key; defaults to UNSLOTH_STUDIO_AUTH_TOKEN or OPENAI_API_KEY env vars (never commit live secrets).
# api_key = ""
# DSPy LM provider prefix paired with qa_model and embedding_model.
provider = "openai"
# Embedding model identifier served at base_url.
embedding_model = "embeddinggemma-2"
# EmbeddingGemma prompt formatting mode ("search", "titled", "qa", "distinct", "distinct-titled", "fact").
embedding_task_mode = "distinct-titled"
# Shared embedding HTTP concurrency across ingestion and queries.
embed_max_in_flight = 2
# Chat completion model identifier used by Tier-1 dspy.ReAct QA and GEPA optimization.
qa_model = "gemma-4-e4b"
# Optional completion token limit; when omitted, generation capacity is delegated to the endpoint.
# max_output_tokens = 4096
# Maximum ReAct tool/thought iterations for both QA agents and GEPA instruction proposal.
react_max_iters = 6

[runtime]
# Maximum concurrent in-flight recall/qa queries admitted by the daemon.
queue_maxsize = 32
# Loopback host interface bound by the FastMCP Streamable HTTP server.
http_host = "127.0.0.1"
# Loopback TCP port bound by the FastMCP Streamable HTTP server.
http_port = 13306
# Streamable HTTP mount path served by FastMCP.
http_path = "/mcp"

[optimization]
# Default dataset name(s) or bundle paths targeted by `yaw optimize`.
datasets = ["enterprise_rag_bench"]
# Total question count sliced per optimization run.
max_queries = 162
# Starting question offset within the selected dataset slice.
query_offset = 0
# GEPA auto budget tier ("light", "medium", or "heavy") when max_metric_calls is unset.
auto = "light"
