# YAW Engine Configuration

[mcp]
host = "127.0.0.1"  # FastMCP host ip
port = 8765         # FastMCP host port

[storage]
vault_root = "sample-llm-wiki"         # '/dir' for absolute, 'dir' for relative to yaw.py
db_path = ".cache/vectors.db"   # path to sqlite db (relative to yaw.py)
busy_timeout_s = 60.0           # SQLite busy timeout in seconds
connect_timeout_s = 60.0        # SQLite connect timeout in seconds
journal_mode = "WAL"            # SQLite journal mode
synchronous = "NORMAL"          # SQLite synchronous mode

[models]
host = "http://localhost:11434"                 # LLM API endpoint
provider = "ollama"                             # one of: ollama,
embedding_model = "embed-gemma-300m-FLM"        # LLM model name
chat_model = "Qwen3-4B-Instruct-2507-GGUF"
extraction_context_tokens = 32768               # 32k context window for few-shot and long documents
embed_timeout_s = 300.0                         # timeout for embedding requests
chat_timeout_s = 300.0                          # timeout for chat requests
embed_max_inflight = 4                          # max concurrent embedding requests

[chunking]
chunk_size = 1000                   # Cocoindex chunking character target
chunk_overlap = 150                 # Cocoindex chunk overlap target
included_patterns = ["**/*.md"]     # included and excluded glob patterns
excluded_patterns = ["templates", "templates/**", "mcp", "mcp/**", "scripts", "scripts/**", "**/.*", "**/.*/**"]

[taxonomy]
llm_ner_if_ner_below = 3    # Yaw switches to LLM-based NER if regular yields less than this limit / chunk
base_predicates = []        # Define explicit base predicates or allow freeform taxonomy to form on an empty array.
definition_max_words = 50   # Max words for spacy.Summarization.v1 node definition generation

[ontology]
namespaces = [          # Define explicit root ontologies or allow freeform ontologies on an empty array.
    "entities", "concepts", "claims",
    "invariants", "decisions", "processes",
    "sources", "contexts", "predicates",
]
similarity_sigma = 3.0  # Flatten ontology to similarity sigma (outliers, synonyms etc beyond this limit are merged)
confidence_threshold = 0.95  # Confidence threshold below which relations surface under Contradictions

[canonicalization]
sim_high = 0.95
sim_low = 0.80
lexical_min = 0.85
top_k = 5
llm_confidence = 0.80
llm_temperature = 0.1

[graph]
alpha = 0.85        # ppr damping factor (recommended: 0.5...0.85)

[indexing]
timeout_s = 0.0  # timeout for indexing operations (for example, when testing), 0 = persistent / no timeout

[reranker]
relevance_threshold = 0.10

[retrieval]
default_top_k = 3
fts_top_n = 40
vec_top_n = 40
graph_top_n = 40
